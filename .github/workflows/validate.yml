# Validate source and mocked infrastructure only; this workflow cannot deploy to AWS.
name: Validate research software
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TASK_TERRAFORM_SHA256: "dcd4b31225dd960404f744315c0c3823a7deeda43bca0256a17fc762092d7e1b"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-verified Terraform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dissertation-tools"
          cd "$RUNNER_TEMP/dissertation-tools"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.15.0/terraform_1.15.0_linux_amd64.zip
          echo "$TASK_TERRAFORM_SHA256  terraform.zip" | sha256sum -c -
          unzip -q terraform.zip
          echo "$RUNNER_TEMP/dissertation-tools" >> "$GITHUB_PATH"
      - name: Install isolated pinned ML dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dissertation-ml"
          "$RUNNER_TEMP/dissertation-ml/bin/python" -m pip install --only-binary=:all: -r requirements-ml.txt
          "$RUNNER_TEMP/dissertation-ml/bin/python" -m pip check
          echo "$RUNNER_TEMP/dissertation-ml/bin" >> "$GITHUB_PATH"
      - name: Check Python and function descriptions
        run: |
          python3 scripts/check_function_docs.py
          python3 scripts/audit_catalog.py
          python3 -m unittest discover -s tests -v
      - name: Validate Terraform without backend access
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/baseline init -backend=false -input=false
          terraform -chdir=infra/baseline validate
          terraform -chdir=infra/baseline test
          terraform -chdir=infra/access init -backend=false -input=false
          terraform -chdir=infra/access validate
          terraform -chdir=infra/access test
